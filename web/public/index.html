<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algorithm Mirror — Upload & View</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 2rem; line-height: 1.6; }
.container { max-width: 1200px; margin: 0 auto; }
h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #fff; }
.tagline { color: #888; margin-bottom: 2rem; }
.upload-zone { border: 2px dashed #333; border-radius: 8px; padding: 2rem; text-align: center; margin-bottom: 2rem; background: #111; cursor: pointer; transition: border-color 0.2s; }
.upload-zone:hover { border-color: #555; }
.upload-zone.dragging { border-color: #0af; background: #001a2e; }
.file-input { display: none; }
.btn { background: #0af; color: #000; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 1rem; }
.btn:hover { background: #08d; }
.btn:disabled { background: #333; color: #666; cursor: not-allowed; }
.error { background: #2a0a0a; border-left: 4px solid #c00; padding: 1rem; margin: 1rem 0; border-radius: 4px; }
.warning { background: #2a1a0a; border-left: 4px solid #f80; padding: 1rem; margin: 1rem 0; border-radius: 4px; }
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin: 2rem 0; }
.stat { background: #111; padding: 1rem; border-radius: 4px; border: 1px solid #222; }
.stat-label { font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 1.75rem; font-weight: 700; color: #fff; margin-top: 0.25rem; }
table { width: 100%; border-collapse: collapse; margin: 2rem 0; background: #111; border-radius: 8px; overflow: hidden; }
th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #222; }
th { background: #1a1a1a; font-weight: 600; color: #aaa; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; }
td { color: #e0e0e0; }
tr:last-child td { border-bottom: none; }
.hook { font-weight: 700; }
.hook.low { color: #0f0; }
.hook.medium { color: #ff0; }
.hook.high { color: #f30; }
.pct { font-family: 'Monaco', monospace; }
.spinner { border: 3px solid #222; border-top: 3px solid #0af; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 2rem auto; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.hidden { display: none; }
.issues { margin: 1rem 0; }
.issue-item { background: #1a0a0a; padding: 0.5rem 1rem; margin: 0.5rem 0; border-radius: 4px; font-family: 'Monaco', monospace; font-size: 0.9rem; border-left: 3px solid #c00; }
</style>
</head>
<body>
<div class="container">
  <h1>Algorithm Mirror</h1>
  <p class="tagline">Upload your gambling event log → see the truth behind the numbers</p>

  <div class="upload-zone" id="dropZone">
    <p>Drop CSV here or click to select</p>
    <input type="file" id="fileInput" class="file-input" accept=".csv,.tsv,.txt">
    <button class="btn" onclick="document.getElementById('fileInput').click()">Choose File</button>
  </div>

  <div id="loading" class="hidden">
    <div class="spinner"></div>
    <p style="text-align: center; color: #888;">Processing...</p>
  </div>

  <div id="error" class="error hidden"></div>
  <div id="warnings" class="hidden"></div>

  <div id="totals" class="hidden totals"></div>
  <div id="results" class="hidden"></div>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const loading = document.getElementById('loading');
const errorDiv = document.getElementById('error');
const warningsDiv = document.getElementById('warnings');
const totalsDiv = document.getElementById('totals');
const resultsDiv = document.getElementById('results');

['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
  dropZone.addEventListener(e, ev => { ev.preventDefault(); ev.stopPropagation(); });
});
['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.add('dragging')));
['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.remove('dragging')));
dropZone.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) upload(f); });
fileInput.addEventListener('change', e => { const f = e.target.files[0]; if (f) upload(f); });

function upload(file) {
  errorDiv.classList.add('hidden');
  warningsDiv.classList.add('hidden');
  totalsDiv.classList.add('hidden');
  resultsDiv.classList.add('hidden');
  loading.classList.remove('hidden');

  const fd = new FormData();
  fd.append('csv', file);
  fetch('/upload', { method: 'POST', body: fd })
    .then(r => r.json().then(d => r.ok ? d : Promise.reject(d)))
    .then(render)
    .catch(e => { errorDiv.textContent = e.error || e.message || 'Upload failed'; errorDiv.classList.remove('hidden'); })
    .finally(() => loading.classList.add('hidden'));
}

function render(data) {
  if (data.warnings.length) {
    warningsDiv.innerHTML = `<div class="warning">${data.warnings.join('<br>')}</div>`;
    warningsDiv.classList.remove('hidden');
  }
  if (data.issues.length) {
    const html = '<div class="issues"><strong>Unusable rows (kept for inspection):</strong>' +
      data.issues.map(i => `<div class="issue-item">row ${i.index}: ${i.reason} (${JSON.stringify(i.value)})</div>`).join('') +
      (data.issues.length === 20 ? '<p style="color:#888;margin-top:0.5rem;">… showing first 20</p>' : '') + '</div>';
    warningsDiv.innerHTML += html;
    warningsDiv.classList.remove('hidden');
  }

  totalsDiv.innerHTML = `
    <div class="stat"><div class="stat-label">Files</div><div class="stat-value">${data.totals.files}</div></div>
    <div class="stat"><div class="stat-label">Rows In</div><div class="stat-value">${data.totals.rowsIn}</div></div>
    <div class="stat"><div class="stat-label">Events</div><div class="stat-value">${data.totals.events}</div></div>
    <div class="stat"><div class="stat-label">Users</div><div class="stat-value">${data.totals.users}</div></div>
  `;
  totalsDiv.classList.remove('hidden');

  const hookClass = h => h == null ? '' : (h < 20 ? 'low' : (h < 40 ? 'medium' : 'high'));
  const pct = v => v == null || isNaN(v) ? 'n/a' : (v * 100).toFixed(1) + '%';
  const num = v => v == null ? 'n/a' : v;

  const rows = data.users.map(u => `
    <tr>
      <td>${u.user}</td>
      <td>${u.events}</td>
      <td>${num(u.sessions)}</td>
      <td>${num(u.bets)}</td>
      <td>$${Number(u.staked || 0).toFixed(0)}</td>
      <td>$${Number(u.returned || 0).toFixed(0)}</td>
      <td class="pct">${num(u.rtp)}%</td>
      <td class="hook ${hookClass(u.hook)}">${num(u.hook)}</td>
      <td class="pct">${pct(u.pressureShare)}</td>
      <td class="pct">${pct(u.nightShare)}</td>
      <td class="pct">${pct(u.pReBetAfterLoss30s)}</td>
    </tr>
  `).join('');

  resultsDiv.innerHTML = `
    <h2 style="margin-top: 2rem;">Per-User Metrics</h2>
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Events</th>
          <th>Sess</th>
          <th>Bets</th>
          <th>Staked</th>
          <th>Returned</th>
          <th>RTP</th>
          <th>Hook</th>
          <th>Payday Dep</th>
          <th>Night</th>
          <th>Chase 30s</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  resultsDiv.classList.remove('hidden');
}
</script>
</body>
</html>
